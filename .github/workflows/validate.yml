name: Validate posts

# 글 메타데이터가 표준 분류(data/taxonomy.json)를 어기면 빌드 실패.
# 디자인 규칙(각진 모서리·무그림자·팔레트·serif 없음)이 깨져도 실패.
# 읽기전용 — 커밋하지 않는다(쓰는 잡은 sitemap.yml).
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'posts/**'
      - 'data/taxonomy.json'
      - 'scripts/**'
      - 'css/style.css'
      - '*.html'
  pull_request:
    paths:
      - 'js/**'
      - 'posts/**'
      - 'data/taxonomy.json'
      - 'scripts/**'
      - 'css/style.css'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 글 메타 정합성
        run: node scripts/validate-posts.js
      - name: 장문 검사기 회귀 시험
        run: node scripts/test-long-sentences.js
      - name: 디자인 정합 (각진·무그림자·팔레트·serif 없음·장식글자 없음)
        run: node scripts/check-design.js
      - name: 말투와 낱말 (해요체, 쓰지 않는 낱말, 가운뎃점, 말로 쓴 숫자, 지어낸 말)
        run: node scripts/check-wording.js
      - name: 코스 표준 데이터가 글과 맞나
        run: node scripts/check-course-data.js
      - name: 코스 순수 로직 시험
        run: node scripts/test-course-logic.js
      - name: 코스 두 장 구조
        run: node scripts/check-course-pages.js
      - name: 코드 블록 형식 (하는 일, 단계, 뜻)
        run: node scripts/check-code-blocks.js
      - name: 코드 블록 파서 단위 테스트
        run: node scripts/test-code-steps.js
      - name: 파이썬 블록 실행 검사 시험
        run: python scripts/test-python-outputs.py
      - name: 파이썬 블록 실행 (표준 라이브러리, 찍힌 줄과 단계)
        run: python scripts/check-python-outputs.py
