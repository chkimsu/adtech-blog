name: Validate posts

# 글 메타데이터가 표준 분류(data/taxonomy.json)를 어기면 빌드 실패.
# 디자인 규칙(각진 모서리, 무그림자, 팔레트, serif 없음)이 깨져도 실패.
# 읽기전용 — 커밋하지 않는다(쓰는 잡은 sitemap.yml).
on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'posts/**'
      - 'data/taxonomy.json'
      - 'data/llm-records/**'
      - 'scripts/**'
      - 'css/style.css'
      - '*.html'
  pull_request:
    paths:
      - 'js/**'
      - 'posts/**'
      - 'data/taxonomy.json'
      - 'data/llm-records/**'
      - 'scripts/**'
      - 'css/style.css'
      - '*.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # 파이썬 3.9 는 Ubuntu 26 용 빌드가 없다. ubuntu-latest 가 26 으로 바뀌어도 3.9 를 설치할 수 있게 24.04 로 고정한다.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 글 메타 정합성
        run: node scripts/validate-posts.js
      - name: 장문 검사기 회귀 시험
        run: node scripts/test-long-sentences.js
      - name: 페이지 문장 길이 (demos.html 문단, 데모 메타 설명)
        run: node scripts/check-page-sentences.js
      - name: 디자인 정합 (각진, 무그림자, 팔레트, serif 없음, 장식글자 없음)
        run: node scripts/check-design.js
      - name: 말투와 낱말 (해요체, 쓰지 않는 낱말, 가운뎃점, 말로 쓴 숫자, 지어낸 말, 어색한 낱말)
        run: node scripts/check-wording.js
      - name: 코스 표준 데이터가 글과 맞나
        run: node scripts/check-course-data.js
      - name: 코스 순수 로직 시험
        run: node scripts/test-course-logic.js
      - name: 코스 두 장 구조
        run: node scripts/check-course-pages.js
      - name: 코드 블록 형식 (하는 일, 단계, 뜻)
        run: node scripts/check-code-blocks.js
      - name: 코드 블록 파서 단위 테스트
        run: node scripts/test-code-steps.js
      - name: 코드 블록 형식 검사 시험
        run: node scripts/test-check-code-blocks.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: 파이썬 블록 실행 검사 시험
        run: python scripts/test-python-outputs.py
      - name: LLM 기록 도구 시험 (가짜 Ollama 서버, 덮어쓰기 가드, 프롬프트와 기록의 꼴)
        run: python scripts/test-llm-record.py
      - name: 파이썬 블록 실행 (표준 라이브러리, 찍힌 줄과 단계)
        run: python scripts/check-python-outputs.py
      - name: 관심사 분류 글의 생성기, 프롬프트 파일, 파이썬 1 블록이 같은가
        run: python scripts/gen-interest-articles.py --check
      - name: 컨텍스추얼 타겟팅 글의 생성기, 프롬프트 파일, 파이썬 1 블록이 같은가
        run: python scripts/gen-context-pages.py --check
      - name: LLM 문제 20개의 생성기, 프롬프트 파일, 파이썬 블록이 같은가
        run: python scripts/gen-llm-problems.py --check
      - name: RAG 글의 생성기, 프롬프트 파일, 파이썬 블록이 같은가
        run: python scripts/gen-rag-docs.py --check
      - name: LLM-as-a-Judge 글의 생성기, 프롬프트 파일 둘, 파이썬 블록이 같은가
        run: python scripts/gen-judge-pairs.py --check
      - name: LLM 광고 응용 트랙의 공용 회원과 키워드 생성기, 놀이터 데이터, 글의 KEYWORDS 리터럴, 프롬프트 파일이 같은가
        run: python scripts/gen-ads-data.py --check
      - name: 자연어 → 타겟 조건 글의 요청 30개 생성기, 프롬프트 파일 셋, 파이썬 1 블록의 REQUESTS 리터럴이 같은가
        run: python scripts/gen-nl-requests.py --check
      - name: LLM 라벨과 코드 랭커 글의 후보 30개 생성기, 프롬프트 파일 둘, 기록 둘, 파이썬 1 블록의 CANDIDATES 리터럴이 같은가
        run: python scripts/gen-ranker-data.py --check
      - name: LLM 기록 상수 (글의 RECORD, USAGE 줄이 기록 파일에서 뽑은 줄과 같은가)
        run: python scripts/check-llm-constants.py
